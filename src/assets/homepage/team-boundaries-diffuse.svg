<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title description">
  <title id="title">A bounded team becomes diffuse activity</title>
  <desc id="description">Four people work within a clear team boundary along a shared flow. Below, the same four people are dispersed without a boundary and move in different directions.</desc>

  <defs>
    <marker id="charcoal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D2421" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="slate-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#68726D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <g id="charcoal-person" fill="#1D2421">
      <circle cx="0" cy="-10" r="5"/>
      <path d="M -6 -3 Q 0 -6 6 -3 L 4 12 L 1.8 12 L 1.8 22 L -1.8 22 L -1.8 12 L -4 12 Z"/>
    </g>
    <g id="slate-person" fill="#68726D">
      <circle cx="0" cy="-10" r="5"/>
      <path d="M -6 -3 Q 0 -6 6 -3 L 4 12 L 1.8 12 L 1.8 22 L -1.8 22 L -1.8 12 L -4 12 Z"/>
    </g>
  </defs>

  <!-- Bounded team: a shared signal passes through a compact team boundary. -->
  <g stroke="#1D2421" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="78" y="76" width="204" height="88" fill="none"/>
    <path d="M 32 120 H 318" fill="none" marker-end="url(#charcoal-arrow)"/>
    <circle cx="332" cy="120" r="8" fill="none"/>
  </g>
  <circle cx="28" cy="120" r="8" fill="#D96B18"/>

  <use href="#charcoal-person" transform="translate(112 112)"/>
  <use href="#charcoal-person" transform="translate(157 112)"/>
  <use href="#charcoal-person" transform="translate(203 112)"/>
  <use href="#charcoal-person" transform="translate(248 112)"/>

  <!-- Lost boundary: the same people remain, but action disperses. -->
  <g fill="none" stroke="#68726D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#slate-arrow)">
    <path d="M 80 294 C 105 286 126 274 150 259"/>
    <path d="M 248 282 C 273 265 292 244 310 218"/>
    <path d="M 137 385 C 111 393 88 406 62 426"/>
    <path d="M 282 397 C 302 415 315 434 326 458"/>
  </g>

  <use href="#slate-person" transform="translate(72 304)"/>
  <use href="#slate-person" transform="translate(240 292)"/>
  <use href="#slate-person" transform="translate(145 378)"/>
  <use href="#slate-person" transform="translate(274 390)"/>
</svg>
